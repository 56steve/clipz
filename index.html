<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipz - Clipboard Notch Hub</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Floating Top-Center Dynamic Island Notch Shell -->
  <div id="notch-shell" class="notch-shell state-pill collapsed">
    
    <!-- Collapsed Notch Header / Pill Bar -->
    <header id="notch-header" class="notch-header">
      <div class="pill-brand">
        <span class="notch-logo-dot"></span>
        <span class="notch-title">CLIPZ</span>
      </div>
      <div class="pill-stream-preview" id="pill-preview">
        <span class="stream-text" id="stream-text">Listening for copied clips...</span>
      </div>
      <div class="pill-actions">
        <button id="toggle-expand-btn" class="icon-btn" title="Toggle Expand (Alt+C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </header>

    <!-- Expanded Notch Drawer Body -->
    <main id="notch-body" class="notch-body">
      <!-- Search & Quick Filter Bar -->
      <section class="search-section">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search..." autofocus />
          <kbd class="shortcut-badge">Esc to collapse</kbd>
        </div>

        <div class="filter-pills">
          <button class="filter-btn active" data-filter="all">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            All
          </button>
          <button class="filter-btn" data-filter="text">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Text
          </button>
          <button class="filter-btn" data-filter="code">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            Code
          </button>
          <button class="filter-btn" data-filter="image">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Images
          </button>
          <button class="filter-btn" data-filter="link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Links
          </button>
          <button class="filter-btn" data-filter="sensitive">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Sensitive
          </button>
        </div>
      </section>

      <!-- Clipboard Timeline Stream -->
      <section class="timeline-section" id="timeline-section">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">📋</div>
          <p>No clips recorded yet.</p>
          <span>Copy text in any application to stream it here.</span>
        </div>
        <div class="clips-container" id="clips-container"></div>
      </section>

      <!-- Notch Footer / Status bar -->
      <footer class="notch-footer">
        <div class="status-shortcut">
          <span class="key-hint">↑ ↓</span> navigate
        </div>
        <div class="status-shortcut">
          <span class="key-hint">↵</span> copy
        </div>
        <div class="status-shortcut">
          <span class="key-hint">esc</span> to close
        </div>
      </footer>
    </main>

    <!-- Paste History Popup Overlay -->
    <div id="history-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>📋 Paste History Log</h3>
          <button id="close-modal-btn" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body" id="history-list"></div>
      </div>
    </div>

    <!-- Delete Confirmation Modal Overlay -->
    <div id="delete-modal" class="modal-overlay hidden">
      <div class="modal-content delete-modal-content">
        <div class="modal-header">
          <h3>🗑️ Delete Clip</h3>
          <button id="close-delete-modal-btn" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <p class="delete-warning-text">Are you sure you want to permanently delete this clip?</p>
          <div id="delete-clip-preview" class="delete-clip-preview"></div>
        </div>
        <div class="modal-footer">
          <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
          <button id="confirm-delete-btn" class="btn btn-danger">Delete Permanently</button>
        </div>
      </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" class="lightbox-overlay hidden">
      <button id="close-lightbox-btn" class="lightbox-close" title="Close Preview">&times;</button>
      <div class="lightbox-container">
        <img id="lightbox-img" class="lightbox-img" alt="Full Image Preview" />
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
