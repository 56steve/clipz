name: Release Clipz (Windows & macOS)

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Production Executables
        run: npx tauri build

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Clipz ${{ github.ref_name }}'
          body: |
            Official production release of Clipz Desktop Clipboard Notch Hub for Windows and macOS.
            
            ### Downloads
            - **Windows**: `Clipz_0.1.0_x64-setup.exe` (Installer) or `clipz.exe` (Portable)
            - **macOS**: `Clipz_0.1.0_x64.dmg` / `Clipz.app.tar.gz`
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/clipz.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

