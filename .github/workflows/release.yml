name: Release Clipz (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Production Executable
        run: npm run tauri build

      - name: Publish GitHub Release (.exe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Clipz ${{ github.ref_name }} (.exe)'
          body: |
            Official production release of Clipz Desktop Clipboard Notch Hub for Windows.
            
            ### Available Executables
            - **`Clipz_0.1.0_x64-setup.exe`**: Standard Windows Installer
            - **`clipz.exe`**: Standalone Portable Executable
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/clipz.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
