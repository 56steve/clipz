name: CI (Windows & macOS)

# Validation gate for the development branch and pull requests.
# Builds the full Tauri app on both target OSes but publishes nothing —
# releases are handled separately by release.yml on `v*` tags.

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Typecheck & build frontend
        run: npm run build

      # Windows needs only the executable here: the MSIX is packaged from it
      # below, and CI has no use for the MSI or NSIS installers. Skipping the
      # bundlers also skips downloading WiX and NSIS from GitHub on every run,
      # which is a third-party fetch that has already failed a build with an
      # HTTP 500. release.yml still builds the installers.
      - name: Build Tauri app (no bundles)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --no-bundle

      - name: Build Tauri app (no publish)
        if: matrix.os != 'windows-latest'
        run: npx tauri build

      # Catch MSIX packaging breakage on every PR rather than at submission
      # time. Unsigned on purpose: the Store signs submissions itself.
      - name: Package MSIX (Windows)
        if: matrix.os == 'windows-latest'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/msix/build-msix.ps1

      - name: Upload MSIX artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clipz-msix
          path: target-msix/*.msix
          if-no-files-found: error

      # The Windows App Certification Kit runs the same suite Store
      # certification does, so a failure here is a failure there. Running it on
      # every Windows build means submissions stop being the place we find out.
      - name: Windows App Certification Kit
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $appcert = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path $appcert)) {
            throw "appcert.exe not found at $appcert. The runner image no longer ships the App Certification Kit."
          }

          $package = Get-ChildItem 'target-msix\*.msix' | Select-Object -First 1
          if (-not $package) { throw 'No MSIX package was produced.' }

          $report = Join-Path $env:GITHUB_WORKSPACE 'target-msix\wack-report.xml'
          & $appcert reset
          & $appcert test -appxpackagepath $package.FullName -reportoutputpath $report
          if (-not (Test-Path $report)) { throw 'The certification kit produced no report.' }

          # appcert's own exit code does not reflect the verdict, and
          # OVERALL_RESULT reports PASS even when individual tests fail — the
          # blocked-executable failure it hid is exactly the kind of thing the
          # Store rejects for. Judge on the tests themselves.
          $xml = [xml](Get-Content $report)
          $overall = $xml.REPORT.OVERALL_RESULT
          $failed = @($xml.SelectNodes('//TEST') | Where-Object { $_.RESULT.'#cdata-section'.Trim() -ne 'PASS' })

          # Tauri's own process::restart uses std::process::Command, and the Rust
          # standard library carries cmd.exe strings for batch-file handling, so
          # every Tauri app trips "Blocked executables" on these five references.
          # We cannot remove them without patching Tauri, and the kit marks the
          # test optional. Any reference BEYOND these still fails the build —
          # that is what caught the powershell call we had added ourselves.
          $knownBlockedRefs = @(
            'kernel32.dll!CreateProcessW',
            'shell32.dll!ShellExecuteW',
            '"cmd"',
            '"cmd.exe"',
            '"\cmd.exe"'
          )

          $blocking = @()
          Write-Host "Overall: $overall; $($failed.Count) failing test(s)"
          foreach ($test in $failed) {
            $messages = @($test.MESSAGES.MESSAGE | ForEach-Object { $_.TEXT })
            $unexpected = @($messages | Where-Object {
              $message = $_
              -not ($knownBlockedRefs | Where-Object { $message -like "*$_*" })
            })

            if ($test.NAME -eq 'Blocked executables' -and $unexpected.Count -eq 0) {
              Write-Host "KNOWN (not blocking): $($test.NAME) - only Tauri's own process references"
              continue
            }

            Write-Host "FAIL: $($test.NAME)"
            foreach ($message in $unexpected) { Write-Host "    $message" }
            $blocking += $test.NAME
          }

          if ($blocking.Count -gt 0) {
            throw "App Certification Kit: $($blocking -join ', ')"
          }
          if ($overall -ne 'PASS') { throw "App Certification Kit result: $overall" }

      - name: Upload certification report
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: clipz-wack-report
          path: target-msix/wack-report.xml
          if-no-files-found: warn
